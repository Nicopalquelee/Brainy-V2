services:
  - type: web
    name: brainy-backend
    runtime: node
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: ${SUPABASE_URL}
      - key: SUPABASE_ANON_KEY
        value: ${SUPABASE_ANON_KEY}
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ${SUPABASE_SERVICE_ROLE_KEY}
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: OPENAI_API_KEY
        value: ${OPENAI_API_KEY}

  - type: web
    name: brainy-frontend
    runtime: node
    plan: starter
    branch: main
    rootDir: front
    buildCommand: npm ci && npm run build
    startCommand: npm run preview
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: ${BACKEND_API_URL}

# Render.yaml Configuration Notes
# =================================
# Both services use type: web (only fully supported type in Render)
#
# Backend Service (brainy-backend):
#   - Runtime: Node.js
#   - Runs `npm run build` to compile TypeScript → dist/
#   - Starts with `npm run start:prod` (executes dist/main.js)
#   - Plan: starter (minimal resources; upgrade to standard or pro as needed)
#
# Frontend Service (brainy-frontend):
#   - Runtime: Node.js
#   - Builds with `npm run build` (Vite compiles React → dist/)
#   - Starts with `npm run preview` (Vite's preview server)
#   - VITE_API_URL points to backend via BACKEND_API_URL secret
#
# Secrets to configure in Render Dashboard (per service):
#
# Backend Secrets:
#   - SUPABASE_URL (from Supabase project settings)
#   - SUPABASE_ANON_KEY (Supabase public key)
#   - SUPABASE_SERVICE_ROLE_KEY (Supabase service role key - KEEP PRIVATE)
#   - DATABASE_URL (PostgreSQL connection string, if external DB)
#   - JWT_SECRET (generate with: openssl rand -hex 32)
#   - OPENAI_API_KEY (from OpenAI dashboard)
#
# Frontend Secrets:
#   - BACKEND_API_URL (set to your backend URL, e.g. https://brainy-backend.onrender.com)
#
# After importing this repo into Render Dashboard:
#   1. Connect GitHub account and select Brainy-V2 repo
#   2. Render auto-detects render.yaml and creates services
#   3. For each service, go to Settings → Environment
#   4. Add all required secrets listed above
#   5. Services will auto-deploy when you push changes to main branch