services:
  - type: web
    name: brainy-backend
    runtime: node
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_ANON_KEY
        fromSecret: SUPABASE_ANON_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromSecret: SUPABASE_SERVICE_ROLE_KEY
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: OPENAI_API_KEY
        fromSecret: OPENAI_API_KEY

  - type: static_site
    name: brainy-frontend
    branch: main
    rootDir: front
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://brainy-backend.onrender.com

# Render.yaml Configuration Notes
# =================================
# Backend (type: web):
#   - Runtime: Node.js
#   - Runs `npm run build` to compile TypeScript → dist/
#   - Starts with `npm run start:prod` (executes dist/main.js)
#   - Plan: starter (minimal resources; upgrade as needed)
#
# Frontend (type: static_site):
#   - Builds with `npm run build` (Vite compiles React → dist/)
#   - Publishes contents of `dist/` as static files
#   - Sets VITE_API_URL to backend URL for API calls
#
# Secrets to configure in Render Dashboard:
#   - SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY (from Supabase)
#   - DATABASE_URL (Postgres connection string if using external DB)
#   - JWT_SECRET (for auth tokens; generate a strong random string)
#   - OPENAI_API_KEY (for ChatGPT integration)
#
# After importing this repo into Render:
#   1. Go to Dashboard → Settings
#   2. Add Environment → add each secret listed above
#   3. Services will auto-deploy when you push to main
