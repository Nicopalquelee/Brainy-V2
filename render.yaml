# Render YAML for Brainy-V2
# - Frontend: Vite React app in `front/` (built and published as static site)
# - Backend: NestJS Node app in `backend/` (TypeScript build then run)
# Customize secrets/env vars via Render dashboard (this file references secrets by name)

services:
  - type: web_service
    name: brainy-frontend
    env: node
    plan: starter
    branch: main
    root: front
    buildCommand: npm ci && npm run build
    startCommand: npm run preview
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

  - type: web_service
    name: brainy-backend
    env: node
    plan: starter
    branch: main
    root: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_ANON_KEY
        fromSecret: SUPABASE_ANON_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromSecret: SUPABASE_SERVICE_ROLE_KEY
      - key: DATABASE_URL
        fromSecret: DATABASE_URL

# Notes:
# - After you import this repo into Render, go to the service settings and add the referenced secrets
#   (SUPABASE_*, DATABASE_URL) through the Render dashboard Secrets UI.
# - Both frontend and backend are configured as web_service (Node environment) for simplicity.
# - Frontend uses `npm run preview` to serve the Vite dist build after compilation.
# - Backend runs `npm run start:prod` which executes the compiled NestJS app from dist/.
# - If your backend requires additional environment variables (JWT secrets, API keys, etc.),
#   add them under the backend's `envVars` section and configure them as Render secrets.
# - The `plan: starter` is a minimal instance; choose a different `plan` if you need more CPU/memory.
